[workspace]
resolver = "2"
members = [
  "crates/frost-core",
  "crates/frost-index",
  "crates/frost-model",
  "crates/frost-train",
  "crates/frost-cli",
  "crates/frost-platform",
  "crates/frost-desktop",
  "crates/frost-mlx",
  "crates/frost-tensors",
  "crates/frost-gen",
  "crates/frost-store",
  "crates/frost-kernels",
  "crates/frost-chat",
  "crates/frost-tools",
  "crates/frost-repo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
